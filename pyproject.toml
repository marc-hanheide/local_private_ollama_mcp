[project]
name = "local-private-ollama-mcp"
version = "0.4.0"
description = "Narrow, privacy-preserving MCP server that lets Claude delegate document questions to a local Ollama model."
readme = "README.md"
authors = [{ name = "Marc Hanheide", email = "marc@hanheide.net" }]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.27",
    "markitdown[pdf]>=0.1.2",
    "pydantic>=2.7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/marc-hanheide/local_private_ollama_mcp"

[project.scripts]
local-private-ollama-mcp = "local_private_ollama_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "reportlab>=4",
    "pyyaml>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_private_ollama_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
